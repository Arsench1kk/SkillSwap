name: web-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://skillswap:skillswap@localhost:5432/skillswap
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: skillswap
          POSTGRES_PASSWORD: skillswap
          POSTGRES_DB: skillswap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillswap -d skillswap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
